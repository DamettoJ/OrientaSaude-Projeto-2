name: Atualizar notícias oficiais de saúde (Tríplice Fronteira)

on:
  push:
    branches: [main]
    paths:
      - scripts/update_news.py
      - .github/workflows/update-news.yml
  schedule:
    # A cada 6 horas (UTC). Agendamentos do GitHub podem sofrer atrasos.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias-oficiais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar RSS oficiais e preservar dados anteriores em caso de falha
        run: python scripts/update_news.py
      - name: Publicar JSON atualizado, se houver mudanças
        run: |
          git add orientasaude/data/news.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: atualizar notícias oficiais de saúde"
            git push
          else
            echo "Sem mudanças no arquivo de notícias."
          fi
